[project]
name = "ltesniffer-gui-backend"
version = "0.1.0"
description = "Backend for the LTESniffer web GUI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    # HTTP Basic Auth credentials are stored as a bcrypt hash on disk so a
    # compromised auth.json doesn't reveal the password — bcrypt handles the
    # salting + verify. Pinned to v4 to avoid the 4.x→5.x API change on the
    # horizon.
    "bcrypt>=4.0,<5.0",
    # Self-signed TLS cert + key are generated in pure Python on first start
    # (no openssl binary dependency, works the same on every distro).
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio"]
# Optional sinks — each is lazily imported at runtime and degrades gracefully
# if missing; install all of them to get the full feature set.
extras = [
    "prometheus_client>=0.19",  # /metrics Prometheus exporter (metrics.py)
    "zstandard>=0.22",          # session recorder + replay (recorder.py)
    "pyzmq>=25",                # ZMQ PUB event sink (zmq_pub.py)
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "sniffer", "mock", "config", "usrp"]
